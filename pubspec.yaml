name: brewtopia
description: "Brewtopia - game simulasi kafe: layani pelanggan, kembangkan kafemu, bersaing di papan peringkat."
publish_to: 'none'
version: 2.0.0+2

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # --- Arsitektur: MVVM + reactive state + DI + navigasi ---
  provider: ^6.1.2          # reactive state management (ChangeNotifier)
  get_it: ^8.0.3            # dependency injection / service locator
  go_router: ^15.1.2        # navigasi deklaratif + auth guard

  # --- Firebase ---
  firebase_core: ^3.15.2
  firebase_auth: ^5.7.0
  cloud_firestore: ^5.6.12

  # --- Geolocation ---
  geolocator: ^14.0.2
  geocoding: ^4.0.0

  # --- Background operation ---
  workmanager: ^0.10.10
  flutter_local_notifications: ^19.4.0

  # --- Audio, sensor (efek parallax 3D), penyimpanan, font ---
  audioplayers: ^6.5.0
  sensors_plus: ^6.1.1
  shared_preferences: ^2.5.3
  google_fonts: ^6.3.0
  flutter_tts: ^4.2.3        # suara dialog (gender: pitch + voice)

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/scene/
    - assets/people/
    - assets/sfx/
    - assets/audio/
